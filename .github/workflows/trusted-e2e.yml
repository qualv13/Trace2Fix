name: Trusted end-to-end

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: trusted-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/qualv13/trace2fix-e2e
      CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/trusted-e2e.yml@${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push the test image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: test/e2e
          file: test/e2e/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:run-${{ github.run_id }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create the SLSA provenance predicate
        run: |
          jq --null-input \
            --arg source "git+https://github.com/${GITHUB_REPOSITORY}.git" \
            --arg revision "${GITHUB_SHA}" \
            --arg builder "${CERTIFICATE_IDENTITY}" \
            --arg invocation "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              buildDefinition: {
                buildType: "https://github.com/qualv13/Trace2Fix/trusted-e2e/v1",
                externalParameters: {},
                internalParameters: {},
                resolvedDependencies: [{ uri: $source, digest: { gitCommit: $revision } }]
              },
              runDetails: {
                builder: { id: $builder },
                metadata: { invocationId: $invocation }
              }
            }' > "${RUNNER_TEMP}/provenance.json"

      - name: Attest the image with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          cosign attest --yes --type slsaprovenance1
          --predicate "${RUNNER_TEMP}/provenance.json"
          "${IMAGE}@${DIGEST}"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Create the test cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: trace2fix-e2e
          version: v0.33.0
          kubectl_version: v1.37.0
          wait: 120s

      - name: Allow the cluster to pull the test image
        run: |
          kubectl create secret generic ghcr-auth \
            --from-file=.dockerconfigjson="${HOME}/.docker/config.json" \
            --type=kubernetes.io/dockerconfigjson
          kubectl patch serviceaccount default \
            --type merge \
            --patch '{"imagePullSecrets":[{"name":"ghcr-auth"}]}'

      - name: Deploy the image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          kubectl create deployment trace2fix-e2e \
            --image="${IMAGE}@${DIGEST}"
          kubectl rollout status deployment/trace2fix-e2e --timeout=120s

      - name: Run trusted inspection
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node bin/trace2fix.js inspect \
            --image "${IMAGE}@${DIGEST}" \
            --kube-context kind-trace2fix-e2e \
            --namespace default \
            --timeout-seconds 300 \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > "${RUNNER_TEMP}/report.json"

          jq --exit-status --arg digest "${DIGEST}" '
            .summary.plans > 0 and
            all(.plans[]; .evidence.provenance.verification.status == "verified") and
            all(.plans[]; .evidence.deployment.imageDigest == $digest)
          ' "${RUNNER_TEMP}/report.json"
          jq '.summary' "${RUNNER_TEMP}/report.json"
